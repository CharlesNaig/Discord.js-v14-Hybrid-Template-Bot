        <text x="92" y="49" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#F8FAFC">Modular</text>
        <text x="92" y="78" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" fill="#D7DEEC">Structure</text>
