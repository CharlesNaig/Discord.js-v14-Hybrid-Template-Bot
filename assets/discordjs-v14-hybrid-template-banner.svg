    <circle cx="45" cy="542" r="4"/><circle cx="67" cy="542" r="4"/><circle cx="89" cy="542" r="4"/><circle cx="111" cy="542" r="4"/>
    <circle cx="1685" cy="52" r="4"/><circle cx="1707" cy="52" r="4"/><circle cx="1729" cy="52" r="4"/><circle cx="1751" cy="52" r="4"/>
