        <path d="M28 34c10-8 37-8 47 0 6 9 9 20 8 31-10 8-19 11-31 11S31 73 21 65c-1-11 2-22 7-31z" fill="#5865F2"/>
        <circle cx="42" cy="52" r="4" fill="white"/><circle cx="62" cy="52" r="4" fill="white"/>
